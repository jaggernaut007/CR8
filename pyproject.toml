[project]
name = "cr8-prototype"
version = "0.5.5"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "langsmith>=0.2",
    "chromadb>=0.5",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "matplotlib>=3.8",
    "tavily-python>=0.5",
    "fpdf2>=2.8",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "markdown>=3.6",
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.9",
    "gunicorn>=22.0",
    "bcrypt>=4.0",
    "google-cloud-storage>=2.14",
    "asyncpg>=0.29",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
video = [
    "kokoro>=0.9",
    "moviepy>=2.0",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",
    "syrupy>=4.0",
    "hypothesis>=6.100",
    "commitizen>=3.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "pytest-randomly>=3.15,<4.0",
    "pytest-timeout>=2.3",
]
eval = [
    "click>=8.1",
    "scipy>=1.11",
    "tabulate>=0.9",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-minify-plugin>=0.8",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "frontend/tests", "gpu_service/tests", "cpu_video_service/tests"]
pythonpath = ["."]
timeout = 30
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    # Tier 1: Must-have (auto-fixable, high-confidence)
    "UP",     # pyupgrade — modern Python syntax
    "B",      # flake8-bugbear — common bugs (mutable defaults, etc.)
    "A",      # flake8-builtins — prevent shadowing builtins
    "T20",    # flake8-print — no print(), use logging

    # Tier 2: Strongly recommended (maintainability)
    "RET",    # flake8-return — clean return patterns
    "SIM",    # flake8-simplify — simplification opportunities
    "PIE",    # flake8-pie — misc Python improvements
    "C90",    # McCabe complexity — flag complex functions
    "G",      # flake8-logging-format — lazy logging format strings
    "ERA",    # eradicate — no commented-out code

    # Tier 3: Structural quality
    "PLR",    # pylint refactor — function size/complexity limits
    "RUF",    # ruff-specific — cleanup rules
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests: allow print, magic values, too-many-args (test fixtures are verbose by nature)
"**/tests/**/*.py" = ["T201", "PLR2004", "PLR0913", "PLR0915"]
# Eval harness: allow print (CLI output) and magic values
"backend/evals/**/*.py" = ["T201", "PLR2004"]
# Scripts: allow print
"scripts/**/*.py" = ["T201"]
"regenerate_from_raw.py" = ["T201"]

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 25
max-branches = 12
max-returns = 6

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.5.5"
tag_format = "v$version"
version_files = ["pyproject.toml:version"]
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend", "gpu_service", "cpu_video_service"]
